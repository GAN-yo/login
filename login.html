<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>退出登录 · 无锡市第一中学学生综合管理平台</title>
    <link rel="stylesheet" href="https://yzxs.wxeic.com/public/default/css/style.css">
    <script src="https://yzxs.wxeic.com/public/default/js/jquery.min.js"></script>
    <style>
        /* 确认弹窗遮罩 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-dialog {
            background: #fff;
            border: 1px solid #ccc;
            padding: 30px 35px;
            width: 420px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
            text-align: center;
        }
        .modal-dialog p {
            font-size: 15px;
            color: #333;
            line-height: 1.8;
            margin-bottom: 25px;
            text-align: left;
        }
        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .modal-buttons button {
            width: 90px;
            height: 36px;
            border: 1px solid #ccc;
            background: #f5f5f5;
            color: #333;
            font-size: 14px;
            cursor: pointer;
            border-radius: 2px;
        }
        .modal-buttons button.confirm-btn {
            background: #b22222;
            color: #fff;
            border-color: #b22222;
        }
        .modal-buttons button:hover {
            opacity: 0.9;
        }
        .disclaimer {
            font-size: 11px;
            color: #999;
            margin-top: 6px;
            line-height: 1.5;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <!-- 头部 -->
    <div class="head">
        <div class="container position-relative">
            <a href="home.html" id="logo" class="fl" style="background:url('img/header_logo.png') no-repeat; background-size:cover;"></a>
            <ul id="header_link">
                <li><a href="home.html">首页</a></li>
                <li><a href="article.html">通知公告</a></li>
                <li><a href="article.html">温馨提示</a></li>
            </ul>
            <div id="quick"><a href="home.html" class="ci-btn"></a></div>
            <div class="user-btn"><a href="home.html"><img src="img/home.png" alt=""></a></div>
        </div>
    </div>

    <div class="main-body">
        <div class="container">
            <div id="slider"><img src="img/banner.jpg" alt=""></div>
            <div class="box">
                <link rel="stylesheet" href="https://yzxs.wxeic.com/public/default/css/swiper-bundle.min.css">
                <script src="https://yzxs.wxeic.com/public/default/js/swiper-bundle.min.js"></script>

                <div class="sidebar">
                    <div class="user border-default">
                        <img src="img/nophoto.jpg" class="fl avatar border-default">
                        <div class="text" id="student-info"></div>
                    </div>
                    <div class="nav-list border-default">
                        <ul>
                            <li><a href="home.html">新生流程</a></li>
                            <li><a href="logout.html">退出登录</a></li>
                        </ul>
                    </div>
                    <div class="ewm border-default">
                        <div class="swiper-container" style="height:245px;">
                            <div class="swiper-wrapper">
                                <div class="swiper-slide">
                                    <img src="img/ewm.png" alt="">
                                    <div class="qrcode-description">(无锡一中微信公众号)<br>扫描二维码添加关注</div>
                                </div>
                            </div>
                            <div class="swiper-pagination"></div>
                        </div>
                    </div>
                    <div class="blogroll">
                        <ul class="nav"><li><a href="https://yizhong.wxeic.cn/" target="_blank">学校主页</a></li></ul>
                    </div>
                </div>

                <div class="main-content">
                    <div class="part border-default mt-10">
                        <div class="title-panel">
                            <div class="title-bar fl"><img src="img/notice.png" alt="">退出登录</div>
                            <div class="title-nav fr"></div>
                        </div>
                        <div style="background:#fff; padding:40px; text-align:center;">
                            <p style="font-size:14px; color:#555;">你已登录新生综合管理平台。如需退出，请点击下方按钮。</p>
                            <button id="show-modal-btn" class="btn btn-red" style="width:120px; height:36px; margin-top:20px;">退出登录</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 确认弹窗 -->
    <div class="modal-overlay" id="modal-overlay" style="display:none;">
        <div class="modal-dialog">
            <p>退出登录后，你在本设备上填写的信息（包括住宿申请和校服订购进度）将被清除。是否确定退出？</p>
            <div class="modal-buttons">
                <button id="cancel-btn">取消</button>
                <button id="confirm-btn" class="confirm-btn">确定退出</button>
            </div>
        </div>
    </div>

    <!-- 尾部 -->
    <div class="foot">
        <div class="container">
            <a href="#" class="botLogo"><img src="img/footer_logo.png" alt=""></a>
            <p>Copyright &copy; 2026 无锡市第一中学 All Rights Reserved.</p>
            <p class="disclaimer">
                【免责声明】本作品为虚构的ARG网页解密游戏，所有人物、事件、机构、数据及历史线索均与现实无关。<br>
                继续浏览或参与互动即表示您已充分理解并接受上述声明。
            </p>
        </div>
    </div>
</div>

<script>
    // 加载用户信息
    function loadUserInfo() {
        var name = localStorage.getItem('studentName');
        if (!name) {
            window.location.href = 'index.html';
            return;
        }
        var surname = localStorage.getItem('studentSurname') || name.charAt(0);
        var id = localStorage.getItem('studentID') || '270512';
        var gender = localStorage.getItem('studentGender') || '保密';
        document.getElementById('student-info').innerHTML =
            '<div>你好，' + surname + '同学</div><div>学号：' + id + '</div><div>性别：' + gender + '</div>';
    }

    // 显示确认弹窗
    document.getElementById('show-modal-btn').addEventListener('click', function() {
        document.getElementById('modal-overlay').style.display = 'flex';
    });

    // 取消
    document.getElementById('cancel-btn').addEventListener('click', function() {
        document.getElementById('modal-overlay').style.display = 'none';
    });

    // 确定退出：清除所有数据，跳转回登录页
    document.getElementById('confirm-btn').addEventListener('click', function() {
        localStorage.clear();
        window.location.href = 'index.html';
    });

    // 点击遮罩关闭（可选）
    document.getElementById('modal-overlay').addEventListener('click', function(e) {
        if (e.target === this) {
            this.style.display = 'none';
        }
    });

    loadUserInfo();
</script>
<script src="https://yzxs.wxeic.com/public/baidu.js"></script>
</body>
</html>
